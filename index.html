<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة كابتن مصر - إشراف محمد سيد كمال</title>
    <style>
        :root {
            --primary: #27ae60;
            --accent: #f1c40f;
            --dark: #121212;
            --card: #1e1e1e;
            --text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--text);
            padding-bottom: 30px;
        }

        .header {
            background: linear-gradient(90deg, #11998e, #38ef7d);
            color: #000;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            font-size: 1.05rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .nav-tabs {
            display: flex;
            background: #252525;
            justify-content: space-around;
            border-bottom: 2px solid #333;
            overflow-x: auto;
        }

        .tab-btn {
            padding: 12px 10px;
            color: #aaa;
            background: none;
            border: none;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom: 3px solid var(--accent);
            background: rgba(255, 255, 255, 0.05);
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #ccc;
            margin-bottom: 5px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
            font-size: 0.95rem;
        }

        .file-input-wrapper {
            border: 2px dashed #555;
            padding: 12px;
            text-align: center;
            border-radius: 12px;
            background: #252525;
            cursor: pointer;
        }

        .file-input-wrapper input {
            display: none;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .price-box {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin: 15px 0;
            border: 1px solid var(--accent);
        }

        .driver-approval-card, .ride-card {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border-right: 5px solid var(--accent);
        }

        .doc-preview {
            width: 100%;
            max-height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 8px;
        }
